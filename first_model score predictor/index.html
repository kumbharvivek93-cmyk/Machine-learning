<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">    <title>Student Score Predictor</title>
</head>
<body>

    <h1>Student Score Predictor</h1>

    <form action="/predict" method="POST">

        <label>Study Hours:</label>
        <input type="number" step="0.1" name="study_hours" required>
        <br><br>

        <label>Attendance:</label>
        <input type="number" name="attendance" required>
        <br><br>

        <label>Assignments Completed:</label>
        <input type="number" name="assignments" required>
        <br><br>

        <label>Previous Score:</label>
        <input type="number" name="previous_score" required>
        <br><br>

        <button type="submit">Predict</button>

    </form>
<br>
    {% if prediction %}

        <h2>Predicted Final Score: {{ prediction }}</h2>

        <h2>Result: {{ result }}</h2>

    {% endif %}

</body>
</html>
